[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragdiag"
version = "0.1.0"
description = "RAG evaluation and root-cause diagnosis SDK/CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "RAGDiag Contributors" }
]
keywords = ["rag", "evaluation", "diagnosis", "metrics", "llm", "hallucination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openai>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/SayanBhattacharjee2006/ragdiag"
Repository = "https://github.com/SayanBhattacharjee2006/ragdiag"
Issues = "https://github.com/SayanBhattacharjee2006/ragdiag/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
ragdiag = "ragdiag.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdiag"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
